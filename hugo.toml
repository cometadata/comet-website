baseURL = 'https://example.org/'
# baseURL define in build command line for flexibility
locale = 'en-us'
title = 'Cometadata development website'
theme = 'comet-theme'

canonifyURLs = true

[permalinks]
  posts = "/blog/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  authors = 'authors'
  categories = 'categories'
  tags = 'tags'

[markup.goldmark.renderer]
    unsafe= true

# make better changes with our own styling in sass
# this get added to the end of the main style file
[params.custom_css]
name = "sass/_cometadata.scss"

[params]
  dateForm = "1/2/06"

[menu]
[[menu.main]]
    name       = "Home"
    identifier = "menu.home"
    url        = "/"
    weight     = 1

[[menu.main]]
    name       = "About"
    url        = "/about"
    weight     = 10
[[menu.main]]
    name       = "The COMET Model"
    url        = "/the-comet-model"
    weight     = 20
[[menu.main]]
    name       = "Projects"
    url        = "/projects"
    weight     = 30
[[menu.main]]
    name       = "Community"
    url        = "/community"
    weight     = 40
[[menu.main]]
    name       = "Blog"
    url        = "/posts"
    weight     = 50

