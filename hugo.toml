baseURL = 'https://example.org/'
locale = 'en-us'
title = 'Cometadata development website'
theme = 'ananke'

# make better changes with our own styling in sass
# this get added to the end of the main style file
[params.custom_css]
name = "sass/_cometadata.scss"

[menu]
[[menu.main]]
    name       = "Home"
