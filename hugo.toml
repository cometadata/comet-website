[[menu.main]]
    name       = "Blocks"
    identifier = "menu.test"
    url        = "/reusable-blocks"
    weight     = 1
[[menu.main]]
    name       = "TestPage"
    identifier = "menu."
    url        = "/testpage"
    weight     = 3

