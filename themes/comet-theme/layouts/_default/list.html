{{ define "main" }}	
	<main id="main-content">
      <header class="homepage-header">
      </header>
      <div class="homepage-content">
		<h1>{{ .Title }}</h1>
		{{ .Content }}
		{{ range .Pages }}
			<h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
		{{ end }}
      </div>
    </main>
{{ end }}
