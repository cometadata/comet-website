{{ define "main" }}
    <main aria-role="main">
      <header class="homepage-header">
      </header>
      <div class="homepage-content">
        {{ with hugo.Data.blog }}
          {{ with .hero }}
            {{ partial "blocks/hero-intro.html" . }}
          {{ end }}
        {{ end }}

        <section class="section-block featured-post">
          <div>
            {{ range where (where .Site.RegularPages "Section" "posts") ".Params.featured" true }}
              {{ partial "blocks/featured-post.html" . }}
            {{ end }}
          </div>
        </section>

        <section class="section-block blog">
          <div>
            <div class="filter-bar" id="filter-controls" data-blog-url="{{ "/posts/" | relURL }}">
              <div class="filter-group">
                <label class="filter-label" for="cat-dropdown">Category</label>
                <select id="cat-dropdown" class="filter-select">
                  <option value="all">All categories</option>
                  {{ range $name, $taxonomy := .Site.Taxonomies.categories }}
                    <option value="{{ $name | urlize }}">{{ $name | humanize }}</option>
                  {{ end }}
                </select>
              </div>

              <div class="filter-group">
                <label class="filter-label" for="tag-dropdown">Topic</label>
                <select id="tag-dropdown" class="filter-select">
                  <option value="all">All topics</option>
                  {{ range $name, $taxonomy := .Site.Taxonomies.tags }}
                    <option value="{{ $name | urlize }}">{{ $name | humanize }}</option>
                  {{ end }}
                </select>
              </div>

              <div class="filter-group">
                <label class="filter-label" for="author-dropdown">Author</label>
                <select id="author-dropdown" class="filter-select">
                  <option value="all">All authors</option>
                  {{ range $name, $taxonomy := .Site.Taxonomies.authors }}
                    <option value="{{ $name | urlize }}">{{ $name | humanize }}</option>
                  {{ end }}
                </select>
              </div>

              <div class="filter-actions">
                <div class="filter-group">
                  <label class="filter-label" for="sort-dropdown">Date order</label>
                  <select id="sort-dropdown" class="filter-select">
                    <option value="desc">Newest to oldest</option>
                    <option value="asc">Oldest to newest</option>
                  </select>
                </div>
                <button type="button" id="clear-filters-btn" class="filter-chip clear">
                  <i class="fa-solid fa-circle-xmark" aria-hidden="true"></i>
                  Clear filters
                </button>
              </div>
            </div>

            <div id="posts-container" class="media-grid three"></div>
            <div id="pagination-container" class="pagination"></div>
          </div>
        </section>
      </div>
    </main>
{{ end }}
