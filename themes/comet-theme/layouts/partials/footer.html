
<footer>

	<div class="row footer-brand">
		<div class="col logo">			
			<a href="{{ .Site.BaseURL }}">
				<img class="header-logo" src="{{ "/images/logos/COMET_Logo_2026_Colour_RGB 1.svg" | relURL }}" alt="COMET" />
			</a>	
		</div>
	</div>
	
	
	<div class="row footer-meta">
		<div class="footer-contact">
			<div class="address">
				{{ hugo.Data.footer.address_text.text |markdownify }}
			</div>
			<div class="socials">
				<ul class="socials-side">
					{{ range hugo.Data.footer.socials.socials }}
						<li><a href="{{ .url }}" class="no-underline">{{ .icon | safeHTML }}</a></li>
					{{ end }}
				</ul>
			</div>
		</div>
	</div>
	<div class="row footer-bottom">
		<div class="copy">&copy; COMET {{ now.Year }}</div>
	</div>
</footer>
