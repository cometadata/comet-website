
<footer>

	<div class="row">
		<div class="col logo">			
			<a href="{{ .Site.BaseURL }}">
				<img class="header-logo" src="{{ .Site.BaseURL }}images/logos/
COMET_Logo_2026_Colour_RGB 1.svg" />
			</a>	
		</div>
	</div>
	
	
	<div class="row">
		<div class="address">
			{{ hugo.Data.footer.address_text.text |markdownify }}
		</div>
		<div class='socials'>
			<ul class="socials-side">
				{{ range hugo.Data.footer.socials.socials }}				
					<li><a href="{{ .url }}">{{ .icon | safeHTML }}</a></li>
				{{ end }}
			</ul>
		</div>
	</div>
	<div class="row d-flex  flex-row mt-0 pt-0">
		<div class="col copy">&copy; COMET</div>
		<div class="col"></div>
		<div class="col-1 d-flex flex-row flex-wrap-nowrap text-end">
			<div class='col tandc m-1'><a href='#'>Terms & Conditions</a></div>
			<div class='col privacy m-1'><a href='#'>Privacy</a></div>
		</div>
	</div>
</footer>
