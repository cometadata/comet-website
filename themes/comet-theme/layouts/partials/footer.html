
<footer>

	<div class="row footer-brand">
		<div class="col logo">			
			<a class='no-underline' href="{{ .Site.BaseURL }}" aria-label="{{ printf "%s home" (.Site.Title | default "COMET") }}">
				<img class="footer-logo" src="{{ "/images/logos/COMET_logo_accessible-Change-White.svg" | relURL }}" alt="" />
			</a>	
		</div>
	</div>
	
	
	<div class="row footer-meta">
		<div class="footer-contact">
			<div class="address">
				{{ hugo.Data.footer.address_text.text |markdownify }}
			</div>
			<div class="socials">
				<ul class="socials-side">
					{{ range hugo.Data.footer.socials.socials }}
						<li><a href="{{ .url }}" class="no-underline">{{ .icon | safeHTML }}</a></li>
					{{ end }}
				</ul>
			</div>
		</div>
	</div>
	<div class="row footer-bottom">
		<div class="col copy">&copy; COMET {{ now.Year }}</div>
		<div class="col"><a href='http://www.cdlib.org/about/accessibility.html'>Accessibility</a></div>
	</div>
</footer>
