<i>featured post</i>
<div class="col-sm-12 col-md-4 col-lg-4">
  <div class="card border shadow-sm">
        <div class="card-body p-3">
            <div class="row">
                {{ if .Params.Title }}
                <a href="{{ .Permalink }}">
                    <h3>{{ .Title }} </h3>
                </a>
                {{ end }}
            </div>

            <div class="post-entry text-secondary">
                {{ if .Description }}
                {{ .Description | plainify }}
                {{ else }}
                {{ .Content }}
                {{ end }}
            </div>
            </div>
        </div>
    </div>
