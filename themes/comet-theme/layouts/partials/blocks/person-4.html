<div class="reps stacked-element">
    <div class="portrait">
        <img src="{{ .media | absURL }}" alt="{{ .name }}">
    </div>
    <div class="person-body">
        <h3>{{ .name }}</h3>
        {{ with .job_title }}
        <div class="person-role">{{ . }}</div>
        {{ end }}
        {{ with .company }}
        <div class="person-company">{{ . }}</div>
        {{ end }}
        {{ partial "blocks/person-link.html" . }}
    </div>
</div>
