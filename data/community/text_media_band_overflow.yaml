headline: "A diverse community"
content: "We recognise that research outputs are the product of many actors whose collective expertise should be empowered to create a complete and accurate scholarly record.

The members in our community represent organisations such as:

- research institutes and labs
- national, public, and institutional libraries
- publishers and publishing technology providers
- PID and bibliographic service providers
- government agencies and policy makers
- research councils and funders
- repositories and archives
- open science advocacy groups"


