headline: "Fostering a community of practice"
content: "COMET's model is designed to build community capacity for this work, not dependency on a single project or service. By establishing shared methods, evaluation standards, and integration pathways, COMET reduces the burden on individual organizations and embeds enrichment as an ongoing practice in existing infrastructures.

Without coordination and shared standards, community enrichment initiatives will remain fragmented and time-limited, reinforcing existing structural inequities. COMET addresses this gap with a proven, scalable model."


