headline: "Key elements"
content: "The COMET community puts these principles into action by prioritising four key elements:"

elements:
  - headline: "Unite quality metadata curation assets"
    content: "The COMET Model confronts one of the most persistent inefficiencies in scholarly communications: valuable, high-quality curation in isolated systems never reaches the wider community. From institutionally verified datasets to proven, scalable enrichment methods—the COMET community brings these assets together, unlocking their collective value.

   Where gaps remain, the COMET organisers act as facilitators, developing innovative capabilities with community partners. The goal is to connect solutions across institutional and geographical boundaries to maximise the value of community investments."  

  - headline: "Target diverse research outputs and stakeholders"
    content: "Inclusive design produces solutions that reflect genuine community needs. The COMET Model addresses metadata quality gaps across research outputs, from datasets and software to posters and articles, ensuring solutions benefit a wide range of stakeholders, such as research institutions, libraries, publishers, and funders."    

  - headline: "Enable multiple round-tripping pathways"
    content: "The COMET community sees successful round-tripping as enrichments flowing back into the systems that maintain and disseminate scholarly metadata. Achieving this requires multiple, complementary pathways. For example, PID-first pathways, such as direct integration with DOI registration agencies, are crucial because they prevent improvements from fragmenting across the ecosystem, while platform-supported pathways, such as connections with submission and publishing systems, offer opportunities to improve metadata as part of communities' existing workflows."    

  - headline: "Treat metadata fields as product features"
    content: "Inspired by software development that makes systematic progress possible, the COMET Model treats each metadata field as a discrete, improvable feature, enabling focused problem-solving and measurable progress. Each project the COMET community undertakes focuses on a single metadata field, producing improvements that can be implemented at scale. 

The COMET community prioritises the following use cases:"

table: "
| Use case    | Metadata fields |
| -------- | ------- |
| Name and describe research outputs  | Title; Work/Resource Type; Language    |
| Identify and connect people associated with research outputs | Author/Creator; Contributor     |
| Identify and connect organisations associated with research outputs    | Affiliation; Funder/Funding    |
| Identify and connect related research outputs    | References; Related Identifiers    |
| Identify access policies associated with research outputs    | License/Rights    |
"