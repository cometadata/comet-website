headline: "Foundational principles"

elements:
  - title: "Collective stewardship"
    content: "The COMET Model shifts the responsibility of metadata quality from individual depositors to a distributed community partnership. Crucially, this does not undermine source authority—it complements it. The model recognises that source authority and metadata quality are distinct. Research outputs are the product of many actors whose collective expertise should be empowered to produce a complete and accurate scholarly record."    
  - title: "Collective benefit"
    content: "The COMET Model addresses the fragmented benefits that result when organisations tackle metadata problems in isolation. Independent fixes by universities, funders, and service providers solve local problems but result in duplicated improvements that never reach the authoritative source. The model provides a collective framework for these community-contributed improvements, structured as open, machine-actionable assertions, to flow back to authoritative sources."    
  - title: "Trust through transparency"
    content: "Traditional PID workflows root trust in the identity of the registrant; the COMET Model extends this by establishing trust in open processes that are rigorous and evidence-based. COMET's enrichments are supported by traceable provenance documentation and publicly shared evaluative frameworks, providing a robust foundation for trustworthy community contributions to the open scholarly record."