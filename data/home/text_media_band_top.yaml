headline: "Collective action leads to structural change"
content: "COMET brings together stakeholders across domains committed to the collective stewardship of quality, trustworthy, and open scholarly metadata.

Together we’re implementing a new model for metadata enrichment that recognises all the stakeholders in research creation, curation, and consumption. Research is a collective endeavour. Its description should be too.

What is the COMET model?
