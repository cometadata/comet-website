headline: "DOI metadata enrichment"
content: "COMET has produced enriched metadata for over 6.2 million unique DOIs across three high-value metadata fields through our targeted enrichment projects.

COMET treats gaps in high-value PID metadata fields as discrete, community-prioritised problems—each one tractable and measurable—demonstrating that collective action produces better outcomes than individual effort alone.

<small>Summary of the impact made as of December 31, 2025. Unique DOIs  enriched: Count of distinct DataCite records that received at least one  enrichment.</small>"

color: "alt"
table: "
| Use case    | Metadata field | Number of unique DOIs
| -------- | ------- | ------- |
| Name and describe research outputs  | Resource type | 3340593    |
| Identify and connect organisations associated with research outputs | Affiliations | 2799081     |
| Identify and connect related research outputs    | Related identifier | 890779 |
